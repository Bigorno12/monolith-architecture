name: Main CI Orchestrator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-entire-pipeline:
    uses: Bigorno12/ci-cd-templates/.github/workflows/master-maven-pipeline.yml@4141abc7cc96e4d384f265d5716b307c2a9c2724
    secrets: inherit
    with:
      java-version: '25'
      cache-type: 'maven'
      build-egress-policy: "block"
      spring-boot-args: "-P dev -pl rest -am"
      test-args: "-Dspring.profiles.active=dev"
      gitops-manifest-path: 'infra/k8s/manifest/api.yaml'