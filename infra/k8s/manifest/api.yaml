apiVersion: v1
kind: Service
metadata:
  name: monolith-api
  namespace: monolith
spec:
  type: ClusterIP
  selector:
    app: monolith-api
    color: green
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-api-blue
  namespace: monolith
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: monolith-api
      color: blue
  template:
    metadata:
      labels:
        app: monolith-api
        color: blue
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monolith-api
          image: ghcr.io/bigorno12/monolith-architecture:main-8ace1ec
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=256m
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: WELLDEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monolith-secrets
                  key: WELLDEV_PASSWORD
            - name: WELLDEV_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monolith-secrets
                  key: WELLDEV.KEYCLOAK.CLIENT-SECRET
            - name: WELLDEV_AES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: monolith-secrets
                  key: WELLDEV.AES.SECRET.KEY
          envFrom:
            - configMapRef:
                name: monolith-api-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
