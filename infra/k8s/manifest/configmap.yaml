apiVersion: v1
kind: ConfigMap
metadata:
  name: monolith-api-config
  namespace: monolith
data:
  WELLDEV_URL: "jdbc:mysql://mysql:3306/welldev"
  WELLDEV_USERNAME: "user"

  WELLDEV_KEYCLOAK_ISSUER_URI: "http://localhost/auth/realms/monolith-keycloak"
  WELLDEV_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost/auth/realms/monolith-keycloak"
  WELLDEV_RESOURCESERVER_JWT_SET_URI: "http://keycloak:7080/auth/realms/monolith-keycloak/protocol/openid-connect/certs"
  WELLDEV_KEYCLOAK_SERVER_URL: "http://keycloak:7080/auth"
  WELLDEV_KEYCLOAK_REALM: "monolith-keycloak"
  WELLDEV_KEYCLOAK_CLIENT_ID: "monolith-keycloak-confidential"

  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://monolith-lgtm:4318/v1/metrics"
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://monolith-lgtm:4318/v1/traces"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: monolith
data:
  MYSQL_DATABASE: "welldev"
  MYSQL_USER: "user"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: monolith
data:
  POSTGRES_DB: "keycloak_db"
  POSTGRES_USER: "keycloak_admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: monolith
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak_db"
  KC_DB_USERNAME: "keycloak_admin"
  KC_HTTP_ENABLED: "true"
  KC_HTTP_RELATIVE_PATH: "/auth"
  KC_HTTP_MANAGEMENT_RELATIVE_PATH: "/"
  # Front-channel URLs (issuer, login page) are the Gateway address; back-channel calls
  # from the API to keycloak:7080 get URLs built from that request instead.
  KC_HOSTNAME: "http://localhost/auth"
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_LOG_CONSOLE_OUTPUT: "json"
